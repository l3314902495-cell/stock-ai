[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-ai"
version = "0.1.0"
description = "AI 驱动的美股与加密货币分析工具（多数据源、可切换 AI 提供方）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=1.8",
    "ccxt>=4.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "anthropic>=2.7",
    "openai>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13",
    "PyYAML>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stockai = "stockai.cli:main"

[tool.setuptools.packages.find]
include = ["stockai*"]

[tool.setuptools.package-data]
"stockai.web" = ["static/*.html", "static/vendor/*"]
